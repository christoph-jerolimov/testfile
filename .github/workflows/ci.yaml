name: CI

on:
  push:
    branches: [main]
  pull_request:

# The whole CI is described by the Testfile in the repository root and runs
# through the bundled action (see action.yml) - schema validation, runner
# build & tests, website build, conformance suite and the action smoke test
# are tests in that file. Failures are annotated on the PR by the action.
#
# One job, three platforms: the runner spawns processes, joins paths and
# resolves globs, so Linux alone would not catch the portability bugs. Tests
# that cannot run everywhere (containers, screenshot comparison) carry an
# `if` condition on TESTFILE_OS in the Testfile itself.
jobs:
  ci:
    name: Testfile CI (${{ matrix.os }})
    strategy:
      # every platform reports its own result; one red leg must not hide
      # whether the others pass
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # The uploaded testfile-run artifact contains the JUnit result
      # (junit.xml) next to the record and logs - no separate reporter or
      # second artifact needed.
      - name: Run the repository Testfile through the bundled action
        uses: ./
        with:
          # artifact names are unique per workflow run, so each leg needs its own
          artifact-name: testfile-run-${{ matrix.os }}
