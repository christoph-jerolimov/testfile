name: CI

on:
  push:
    branches: [main]
  pull_request:

# The whole CI is described by the Testfile in the repository root and runs
# through the bundled action (see action.yml) - schema validation, runner
# build & tests, website build, conformance suite and the action smoke test
# are tests in that file. Failures are annotated on the PR by the action,
# and every test reports its own commit status (see `statuses:` below).
#
# One job, three platforms: the runner spawns processes, joins paths and
# resolves globs, so Linux alone would not catch the portability bugs. Tests
# that cannot run everywhere (containers, screenshot comparison) carry an
# `if` condition on TESTFILE_OS in the Testfile itself.
#
# Three platforms means three recorded runs. The `merge` job below combines
# them into a single run - one verdict, one duration, every test tagged with
# the platform it ran on - and uploads that too.
jobs:
  ci:
    name: Testfile CI (${{ matrix.os }})
    strategy:
      # every platform reports its own result; one red leg must not hide
      # whether the others pass
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # `statuses: write` is what lets the action report each test as its own
    # commit status; the rest of the job only reads the checkout.
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
      # The kubernetes conformance case only runs where kubectl reaches a
      # cluster, so the Linux leg gets a local kind cluster and the case is
      # exercised on every change instead of only on developer machines.
      # (macOS/Windows runners cannot host one; the case skips there, like
      # the podman case does.) HOME survives the runner's env cleaning, so
      # tests find the kubeconfig kind writes to ~/.kube/config.
      - name: Provide a kind cluster for the kubernetes conformance case
        if: matrix.os == 'ubuntu-latest'
        uses: helm/kind-action@v1
        with:
          wait: 120s
      # The uploaded testfile-run artifact contains the JUnit result
      # (junit.xml) next to the record and logs - no separate reporter or
      # second artifact needed.
      - name: Run the repository Testfile through the bundled action
        uses: ./
        with:
          # what tells the three runs apart, and what merging keys on
          variants: platform=${{ matrix.os }}
          # artifact names are unique per workflow run, so each leg needs its own
          artifact-name: testfile-run-${{ matrix.os }}
          # One commit status per test, so a red pull request names the test
          # rather than the platform it was hiding in. The contexts carry the
          # variant above, so the three legs report side by side instead of
          # overwriting each other. A pull request from a fork gets a
          # read-only token and logs a warning here - that is not a failure.
          statuses: true

  merge:
    name: Merge the platform runs
    needs: ci
    # also when a leg failed: a merged run of two green legs and one red one
    # is exactly what is worth looking at
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build --workspace viewer-ts
      # every leg's artifact unpacks into its own folder, and each of those
      # folders is a run folder (run.yaml next to the logs)
      - uses: actions/download-artifact@v8
        with:
          pattern: testfile-run-*
          path: downloaded
      # The merged run is written even when a leg failed, so the artifact
      # always exists; its verdict is turned into this job's result below.
      - name: Merge the runs into one
        id: merge
        run: |
          runs=(downloaded/testfile-run-*)
          echo "merging ${#runs[@]} runs: ${runs[*]}"
          if node viewer-ts/dist/cli.js merge "${runs[@]}" --dir .; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi
          dir=$(ls -d .testfile/runs/*-merged | head -1)
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "id=$(basename "$dir")" >> "$GITHUB_OUTPUT"
      - name: Show the merged run
        run: node viewer-ts/dist/cli.js inspect run "${{ steps.merge.outputs.id }}"
      - uses: actions/upload-artifact@v7
        with:
          name: testfile-run-merged
          path: ${{ steps.merge.outputs.dir }}
          if-no-files-found: error
      # one verdict for the three platforms
      - name: Fail when a platform failed
        if: steps.merge.outputs.passed != 'true'
        run: exit 1
