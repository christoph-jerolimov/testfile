name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testfile:
    name: Run the repository Testfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run all checks via the Testfile
        uses: ./
        with:
          path: .
          reporter: junit
          output: results.xml
      - name: Upload the JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testfile-results
          path: results.xml

  action:
    name: Self-test GitHub Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the action against the smoke Testfile
        uses: ./
        with:
          path: .github/action-smoke
          reporter: junit
          output: results.xml
      - name: Verify the JUnit report
        run: |
          test -f results.xml
          grep -q '<testcase name="hello"' results.xml
          grep -q 'failures="0"' results.xml
