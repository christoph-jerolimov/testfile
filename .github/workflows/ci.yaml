name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  schema:
    name: Validate schema & examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test --workspace schema

  runner:
    name: Build & test runner-ts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test --workspace runner-ts

  website:
    name: Build website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace website

  conformance:
    name: Conformance suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace runner-ts
      - run: npm test --workspace conformance

  action:
    name: Self-test GitHub Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the action against the smoke Testfile
        uses: ./
        with:
          path: .github/action-smoke
          reporter: junit
          output: results.xml
      - name: Verify the JUnit report
        run: |
          test -f results.xml
          grep -q '<testcase name="hello"' results.xml
          grep -q 'failures="0"' results.xml
