name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

# The whole CI is described by the Testfile in the repository root and runs
# through the bundled action (see action.yml) - schema validation, runner
# build & tests, website build, conformance suite and the action smoke test
# are tests in that file. Failures are annotated on the PR by the action.
jobs:
  ci:
    name: Testfile CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the repository Testfile through the bundled action
        uses: ./
        with:
          reporter: junit
          output: results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: results.xml
