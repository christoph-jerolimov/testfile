# Testfile on GitHub Actions, without the bundled action.
#
# On GitHub, prefer the action - it runs the same suite and adds what these
# steps cannot: an annotation on the line of the failing test, a job summary,
# and one commit status per test.
#
#   - uses: christoph-jerolimov/testfile@main
#
# See docs/github-action.md for its inputs. This template is for a pipeline
# that would rather not depend on an action: the same three commands as the
# other files in this folder, spelled out.
#
# Copy it into your project as .github/workflows/testfile.yml.
name: Testfile

on:
  push:
    branches: [main]
  pull_request:
  # so a run can also be started by hand from the Actions tab
  workflow_dispatch:

jobs:
  testfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      # Services the tests need are declared in the Testfile, and the runner
      # starts them itself - docker is already on the GitHub-hosted images,
      # so the job needs no `services:` block of its own.
      - name: Testfile
        run: npx --yes @testfile/runner start --reporter junit --output junit.xml
      # The whole recorded run - run.yaml, per-test logs, service logs,
      # collected artifacts, and junit.xml alongside them. `testfile github
      # sync <owner/repo>` pulls it straight into a local history; a
      # downloaded one goes in with `testfile archive import <run.zip>`.
      #
      # `if: always()` because the interesting run is the one that failed.
      - name: Upload the recorded run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testfile-run
          path: .testfile/runs/
          if-no-files-found: error
      # GitHub has no built-in JUnit view, so the report above is left for
      # whichever test-reporter action you already use, e.g.
      #   - uses: dorny/test-reporter@v2
      #     if: always()
      #     with: { name: Tests, path: junit.xml, reporter: java-junit }
