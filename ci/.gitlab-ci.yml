# Testfile on GitLab CI, without the include-able template.
#
# On GitLab, prefer the template - it runs the same suite and adds what
# these lines leave out: filters and change-based selection as variables,
# a doctor pre-flight, and the run labelled with the GitLab context:
#
#   include:
#     - remote: https://raw.githubusercontent.com/testfile-dev/testfile/main/gitlab/testfile.gitlab-ci.yml
#
# See docs/gitlab-ci.md for its variables. This file is for a pipeline
# that would rather not include a remote template: the same three
# commands as the other files in this folder, spelled out.
#
# Copy it into your project's .gitlab-ci.yml.
testfile:
  image: node:22
  script:
    - npm ci --no-audit --no-fund
    # Services the tests need are declared in the Testfile, and the runner
    # starts them itself. Container services need a docker client and
    # daemon in the job - see docs/gitlab-ci.md#container-services.
    - npx --yes @testfile.dev/runner start --reporter junit --output junit.xml
  artifacts:
    # `when: always` because the interesting run is the one that failed.
    when: always
    paths:
      # The whole recorded run - run.yaml, per-test logs, service logs,
      # collected artifacts, and junit.xml alongside them. `testfile
      # gitlab sync <group/project>` pulls it straight into a local
      # history; a downloaded one goes in with `testfile archive import`.
      - .testfile/runs/
      - junit.xml
    reports:
      # what makes failed tests show up in the merge request widget and
      # the pipeline's Tests tab
      junit: junit.xml
    expire_in: 2 weeks
