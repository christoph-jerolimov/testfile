name: "Testfile"
description: "Run the tests described in a Testfile / testfile.yaml, with services, matrices and filters"
branding:
  icon: "check-square"
  color: "green"

inputs:
  path:
    description: "Testfile or directory containing one"
    required: false
    default: "."
  filter:
    description: "Generic filter (-f): name/path, tag, or key:value matrix"
    required: false
    default: ""
  filter-name:
    description: "Only tests whose path contains this (-n)"
    required: false
    default: ""
  filter-tags:
    description: "Comma-separated tags to run (-t)"
    required: false
    default: ""
  filter-matrix:
    description: "key:value matrix filter (-m)"
    required: false
    default: ""
  changed:
    description: "Run only tests whose `inputs` match files changed against the base branch (testfile run --changed). Needs the base branch in the checkout, e.g. actions/checkout with fetch-depth: 0"
    required: false
    default: "false"
  changed-since:
    description: "Base branch/ref for `changed`. Defaults to the pull request's target branch when the workflow runs on a PR"
    required: false
    default: ${{ github.base_ref }}
  fail-fast:
    description: "Abort the whole run at the first failure"
    required: false
    default: "false"
  max-parallel:
    description: "Global cap on concurrently running tests"
    required: false
    default: ""
  reporter:
    description: "Write machine-readable results: junit or json"
    required: false
    default: ""
  output:
    description: "Report target file (used with reporter)"
    required: false
    default: ""
  node-version:
    description: "Node.js version used to run the Testfile runner"
    required: false
    default: "22"
  annotations:
    description: "Emit GitHub annotations for failed tests (shown on the PR)"
    required: false
    default: "true"
  summary:
    description: "Write a job-summary table of the run's results"
    required: false
    default: "true"
  upload-run:
    description: "Upload the recorded run (.testfile/runs/<id>) as a build artifact, importable with `testfile runs sync`"
    required: false
    default: "true"
  artifact-name:
    description: "Name of the uploaded run artifact"
    required: false
    default: "testfile-run"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    - name: Build the Testfile runner
      shell: bash
      run: |
        cd "${{ github.action_path }}"
        npm ci --no-audit --no-fund
        npm run build --workspace runner-ts

    - name: Run Testfile
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FILTER: ${{ inputs.filter }}
        INPUT_FILTER_NAME: ${{ inputs.filter-name }}
        INPUT_FILTER_TAGS: ${{ inputs.filter-tags }}
        INPUT_FILTER_MATRIX: ${{ inputs.filter-matrix }}
        INPUT_CHANGED: ${{ inputs.changed }}
        INPUT_CHANGED_SINCE: ${{ inputs.changed-since }}
        INPUT_FAIL_FAST: ${{ inputs.fail-fast }}
        INPUT_MAX_PARALLEL: ${{ inputs.max-parallel }}
        INPUT_REPORTER: ${{ inputs.reporter }}
        INPUT_OUTPUT: ${{ inputs.output }}
      run: |
        ARGS=(run "$INPUT_PATH")
        [ -n "$INPUT_FILTER" ] && ARGS+=(-f "$INPUT_FILTER")
        [ -n "$INPUT_FILTER_NAME" ] && ARGS+=(-n "$INPUT_FILTER_NAME")
        [ -n "$INPUT_FILTER_TAGS" ] && ARGS+=(-t "$INPUT_FILTER_TAGS")
        [ -n "$INPUT_FILTER_MATRIX" ] && ARGS+=(-m "$INPUT_FILTER_MATRIX")
        if [ "$INPUT_CHANGED" = "true" ]; then
          ARGS+=(--changed)
          [ -n "$INPUT_CHANGED_SINCE" ] && ARGS+=(--changed-since "$INPUT_CHANGED_SINCE")
        fi
        [ "$INPUT_FAIL_FAST" = "true" ] && ARGS+=(--fail-fast)
        [ -n "$INPUT_MAX_PARALLEL" ] && ARGS+=(--max-parallel "$INPUT_MAX_PARALLEL")
        [ -n "$INPUT_REPORTER" ] && ARGS+=(--reporter "$INPUT_REPORTER")
        [ -n "$INPUT_OUTPUT" ] && ARGS+=(--output "$INPUT_OUTPUT")
        node "${{ github.action_path }}/runner-ts/dist/cli.js" "${ARGS[@]}"

    - name: Annotate failed tests
      if: ${{ always() && inputs.annotations == 'true' }}
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
      run: node "${{ github.action_path }}/action/annotate.mjs" "$INPUT_PATH"

    - name: Write the job summary
      if: ${{ always() && inputs.summary == 'true' }}
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
      run: node "${{ github.action_path }}/action/summary.mjs" "$INPUT_PATH"

    - name: Locate the recorded run
      id: locate-run
      if: ${{ always() && inputs['upload-run'] == 'true' }}
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
      run: node "${{ github.action_path }}/action/locate-run.mjs" "$INPUT_PATH" >> "$GITHUB_OUTPUT"

    # The folder is uploaded as-is; GitHub wraps artifacts in a zip anyway,
    # so the artifact is a single zip with run.yaml and the logs at its root.
    - name: Upload the recorded run
      if: ${{ always() && inputs['upload-run'] == 'true' && steps.locate-run.outputs.run-dir != '' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs['artifact-name'] }}
        path: ${{ steps.locate-run.outputs.run-dir }}
        if-no-files-found: ignore
