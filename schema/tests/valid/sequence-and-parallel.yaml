# Groups: a sequence containing a parallel group.
version: 0
name: groups
env:
  CI: true
test:
  name: all
  sequence:
    - name: build
      command: npm run build
    - name: checks
      tags: [fast]
      parallel:
        - name: lint
          command: npm run lint
        - name: unit
          command: npm run test:unit
        - name: typecheck
          command: npx tsc --noEmit
      maxParallel: 2
    - name: e2e
      tags: [slow, nightly]
      command: npm run test:e2e
    - name: cleanup
      continueOnError: true
      script: |
        rm -rf tmp
        echo "done"
