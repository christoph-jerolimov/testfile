<text y="235" xml:space="preserve"><tspan x="37.2" fill="#29b8db" textLength="117.6" lengthAdjust="spacingAndGlyphs">tab / 1 2     </tspan><tspan x="154.8" fill="#d4d4d8" textLength="84.0" lengthAdjust="spacingAndGlyphs">switch tab</tspan></text>
