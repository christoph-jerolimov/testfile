<text y="121" xml:space="preserve"><tspan x="37.2" fill="#29b8db" textLength="117.6" lengthAdjust="spacingAndGlyphs">s             </tspan><tspan x="154.8" fill="#d4d4d8" textLength="92.4" lengthAdjust="spacingAndGlyphs">sort column</tspan></text>
<text y="140" xml:space="preserve"><tspan x="37.2" fill="#29b8db" textLength="117.6" lengthAdjust="spacingAndGlyphs">r             </tspan><tspan x="154.8" fill="#d4d4d8" textLength="58.8" lengthAdjust="spacingAndGlyphs">reverse</tspan></text>
<text y="159" xml:space="preserve"><tspan x="37.2" fill="#29b8db" textLength="117.6" lengthAdjust="spacingAndGlyphs">enter/click   </tspan><tspan x="154.8" fill="#d4d4d8" textLength="67.2" lengthAdjust="spacingAndGlyphs">open run</tspan></text>
<text y="178" xml:space="preserve"><tspan x="37.2" fill="#29b8db" textLength="117.6" lengthAdjust="spacingAndGlyphs">/             </tspan><tspan x="154.8" fill="#d4d4d8" textLength="50.4" lengthAdjust="spacingAndGlyphs">filter</tspan></text>
