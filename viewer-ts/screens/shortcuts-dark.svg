<text y="26" xml:space="preserve"><tspan x="12.0" fill="#d4d4d8" textLength="67.2" lengthAdjust="spacingAndGlyphs">Testfile</tspan><tspan x="79.2" fill="#d4d4d8" textLength="25.2" lengthAdjust="spacingAndGlyphs" font-weight="bold" opacity="0.55"> › </tspan><tspan x="104.4" fill="#d4d4d8" textLength="75.6" lengthAdjust="spacingAndGlyphs">Shortcuts</tspan></text>
