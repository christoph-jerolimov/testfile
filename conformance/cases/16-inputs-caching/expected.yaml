# Result caching via `inputs`: a passing test with unchanged input files is
# served from the cache on the next run; changing an input re-runs it.
# Tests without `inputs` are never cached.
exitCode: 0
status: passed
tests:
  - { path: root/cachable, status: passed, cached: false }
  - { path: root/always, status: passed, cached: false }
reruns:
  - exitCode: 0
    status: passed
    tests:
      - { path: root/cachable, status: passed, cached: true }
      - { path: root/always, status: passed, cached: false }
  - before: "echo more >> data/input.txt"
    exitCode: 0
    status: passed
    tests:
      - { path: root/cachable, status: passed, cached: false }
      - { path: root/always, status: passed, cached: false }
