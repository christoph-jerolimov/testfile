spec:
  - Containers
  - Engine selection
  - Readiness (ready)
# Container services via podman: a run-level service with a published
# random port (tcp + in-container exec readiness, reachable from a test), a
# test-scoped container with a log readiness check, and an exec probe sent
# back to the host with host: true. Skipped where podman is missing.
requires: [podman]
# The engine is the run's choice: this case pins it through the environment.
env:
  TESTFILE_ENGINE: podman
exitCode: 0
status: passed
tests:
  - { path: root, status: passed }
  - { path: root/reach-service, status: passed }
  - { path: root/scoped-container, status: passed }
  - { path: root/probe-from-the-host, status: passed }
