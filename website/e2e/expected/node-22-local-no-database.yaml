version: 0

test:
  name: ci
  # the project targets Node.js 22; this runs with whatever is installed
  sequence:
    - name: install
      command: npm ci
    - name: lint
      command: npm run lint
    - name: unit
      command: npm test
      # skipped when none of these changed since the last passing run
      inputs: ["src/**", "package-lock.json"]
