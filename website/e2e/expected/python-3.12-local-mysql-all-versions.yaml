version: 0

# A free port is picked per run, so two runs never collide.
ports:
  mysql9: random
  mysql84: random

test:
  name: ci
  # the project targets Python 3.12; this runs with whatever is installed
  sequence:
    - name: install
      command: pip install -r requirements.txt
    - name: lint
      command: ruff check .
    - name: unit
      command: pytest -q tests/unit
      # skipped when none of these changed since the last passing run
      inputs: ["**/*.py", "requirements.txt"]
    - name: integration
      # one run per database, each with a container of its own
      parallel:
        - name: mysql-9
          services:
            mysql:
              container:
                image: docker.io/library/mysql:9
                ports: ["${{ ports.mysql9 }}:3306"]
                env:
                  MYSQL_ROOT_PASSWORD: test
                  MYSQL_DATABASE: app_test
              ready:
                # runs inside the container, so the image's own client is used
                exec: mysqladmin ping -h 127.0.0.1 --silent
                timeout: 60s
          env:
            DATABASE_URL: mysql://root:test@127.0.0.1:${{ ports.mysql9 }}/app_test
          command: pytest -q tests/integration
        - name: mysql-8.4
          services:
            mysql:
              container:
                image: docker.io/library/mysql:8.4
                ports: ["${{ ports.mysql84 }}:3306"]
                env:
                  MYSQL_ROOT_PASSWORD: test
                  MYSQL_DATABASE: app_test
              ready:
                # runs inside the container, so the image's own client is used
                exec: mysqladmin ping -h 127.0.0.1 --silent
                timeout: 60s
          env:
            DATABASE_URL: mysql://root:test@127.0.0.1:${{ ports.mysql84 }}/app_test
          command: pytest -q tests/integration
