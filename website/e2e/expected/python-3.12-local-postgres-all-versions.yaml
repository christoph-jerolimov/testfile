version: 0

# A free port is picked per run, so two runs never collide.
ports:
  postgres16: random
  postgres17: random
  postgres18: random

test:
  name: ci
  # the project targets Python 3.12; this runs with whatever is installed
  sequence:
    - name: install
      command: pip install -r requirements.txt
    - name: lint
      command: ruff check .
    - name: unit
      command: pytest -q tests/unit
      # skipped when none of these changed since the last passing run
      inputs: ["**/*.py", "requirements.txt"]
    - name: integration
      # one run per version, each with a container of its own
      parallel:
        - name: postgres-16
          services:
            postgres:
              container:
                image: docker.io/library/postgres:16-alpine
                ports: ["${{ ports.postgres16 }}:5432"]
                env:
                  POSTGRES_PASSWORD: test
                  POSTGRES_DB: app_test
              ready:
                # runs inside the container, so the image's own client is used
                exec: pg_isready -h 127.0.0.1 -p 5432 -U postgres
                timeout: 60s
          env:
            DATABASE_URL: postgres://postgres:test@127.0.0.1:${{ ports.postgres16 }}/app_test
          command: pytest -q tests/integration
        - name: postgres-17
          services:
            postgres:
              container:
                image: docker.io/library/postgres:17-alpine
                ports: ["${{ ports.postgres17 }}:5432"]
                env:
                  POSTGRES_PASSWORD: test
                  POSTGRES_DB: app_test
              ready:
                # runs inside the container, so the image's own client is used
                exec: pg_isready -h 127.0.0.1 -p 5432 -U postgres
                timeout: 60s
          env:
            DATABASE_URL: postgres://postgres:test@127.0.0.1:${{ ports.postgres17 }}/app_test
          command: pytest -q tests/integration
        - name: postgres-18
          services:
            postgres:
              container:
                image: docker.io/library/postgres:18-alpine
                ports: ["${{ ports.postgres18 }}:5432"]
                env:
                  POSTGRES_PASSWORD: test
                  POSTGRES_DB: app_test
              ready:
                # runs inside the container, so the image's own client is used
                exec: pg_isready -h 127.0.0.1 -p 5432 -U postgres
                timeout: 60s
          env:
            DATABASE_URL: postgres://postgres:test@127.0.0.1:${{ ports.postgres18 }}/app_test
          command: pytest -q tests/integration
