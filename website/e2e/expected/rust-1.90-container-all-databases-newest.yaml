version: 0

# A free port is picked per run, so two runs never collide.
ports:
  postgres: random
  mysql: random

test:
  name: ci
  # every command below runs in this image, with the project mounted
  container:
    image: docker.io/library/rust:1.90
  sequence:
    - name: install
      command: cargo fetch
    - name: lint
      command: cargo clippy -- -D warnings
    - name: unit
      command: cargo test
      # skipped when none of these changed since the last passing run
      inputs: ["src/**", "Cargo.lock"]
    - name: integration
      # one run per database, each with a container of its own
      parallel:
        - name: postgres
          services:
            postgres:
              container:
                image: docker.io/library/postgres:18-alpine
                ports: ["${{ ports.postgres }}:5432"]
                env:
                  POSTGRES_PASSWORD: test
                  POSTGRES_DB: app_test
              ready:
                # runs inside the container, so the image's own client is used
                exec: pg_isready -h 127.0.0.1 -p 5432 -U postgres
                timeout: 60s
          env:
            DATABASE_URL: postgres://postgres:test@127.0.0.1:${{ ports.postgres }}/app_test
          command: cargo test --test integration
        - name: mysql
          services:
            mysql:
              container:
                image: docker.io/library/mysql:9
                ports: ["${{ ports.mysql }}:3306"]
                env:
                  MYSQL_ROOT_PASSWORD: test
                  MYSQL_DATABASE: app_test
              ready:
                # runs inside the container, so the image's own client is used
                exec: mysqladmin ping -h 127.0.0.1 --silent
                timeout: 60s
          env:
            DATABASE_URL: mysql://root:test@127.0.0.1:${{ ports.mysql }}/app_test
          command: cargo test --test integration
