version: 0

# A free port is picked per run, so two runs never collide.
ports:
  postgres: random

test:
  name: ci
  # every command below runs in this image, with the project mounted
  container:
    image: docker.io/library/maven:3-eclipse-temurin-21
  sequence:
    - name: install
      command: ./mvnw -B -q dependency:go-offline
    - name: lint
      command: ./mvnw -B -q spotless:check
    - name: unit
      command: ./mvnw -B test
      # skipped when none of these changed since the last passing run
      inputs: ["src/**", "pom.xml"]
    - name: integration
      services:
        postgres:
          container:
            image: docker.io/library/postgres:16-alpine
            ports: ["${{ ports.postgres }}:5432"]
            env:
              POSTGRES_PASSWORD: test
              POSTGRES_DB: app_test
          ready:
            # runs inside the container, so the image's own client is used
            exec: pg_isready -h 127.0.0.1 -p 5432 -U postgres
            timeout: 60s
      env:
        DATABASE_URL: postgres://postgres:test@127.0.0.1:${{ ports.postgres }}/app_test
      command: ./mvnw -B verify -Pintegration
