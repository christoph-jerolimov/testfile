version: 0

test:
  name: ci
  # one instance per version, each in its own container
  matrix:
    go: ["1.25", "1.24", "1.23"]
  container:
    image: docker.io/library/golang:${{ matrix.go }}
  sequence:
    - name: install
      command: go mod download
    - name: lint
      command: go vet ./...
    - name: unit
      command: go test ./...
      # skipped when none of these changed since the last passing run
      inputs: ["**/*.go", "go.sum"]
