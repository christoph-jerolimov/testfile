version: 0

# A free port is picked per run, so two runs never collide.
ports:
  postgres18: random
  postgres17: random
  postgres16: random

test:
  name: ci
  # one instance per version, each in its own container
  matrix:
    node: ["24", "22", "20"]
  container:
    image: docker.io/library/node:${{ matrix.node }}
  sequence:
    - name: install
      command: npm ci
    - name: lint
      command: npm run lint
    - name: unit
      command: npm test
      # skipped when none of these changed since the last passing run
      inputs: ["src/**", "package-lock.json"]
    - name: integration
      # one run per database, each with a container of its own
      parallel:
        - name: postgres-18
          services:
            postgres:
              # one container for every instance of the matrix above
              shared: true
              container:
                image: docker.io/library/postgres:18-alpine
                ports: ["${{ ports.postgres18 }}:5432"]
                env:
                  POSTGRES_PASSWORD: test
                  POSTGRES_DB: app_test
              ready:
                # runs inside the container, so the image's own client is used
                exec: pg_isready -h 127.0.0.1 -p 5432 -U postgres
                timeout: 60s
          env:
            DATABASE_URL: postgres://postgres:test@127.0.0.1:${{ ports.postgres18 }}/app_test
          command: npm run test:integration
        - name: postgres-17
          services:
            postgres:
              # one container for every instance of the matrix above
              shared: true
              container:
                image: docker.io/library/postgres:17-alpine
                ports: ["${{ ports.postgres17 }}:5432"]
                env:
                  POSTGRES_PASSWORD: test
                  POSTGRES_DB: app_test
              ready:
                # runs inside the container, so the image's own client is used
                exec: pg_isready -h 127.0.0.1 -p 5432 -U postgres
                timeout: 60s
          env:
            DATABASE_URL: postgres://postgres:test@127.0.0.1:${{ ports.postgres17 }}/app_test
          command: npm run test:integration
        - name: postgres-16
          services:
            postgres:
              # one container for every instance of the matrix above
              shared: true
              container:
                image: docker.io/library/postgres:16-alpine
                ports: ["${{ ports.postgres16 }}:5432"]
                env:
                  POSTGRES_PASSWORD: test
                  POSTGRES_DB: app_test
              ready:
                # runs inside the container, so the image's own client is used
                exec: pg_isready -h 127.0.0.1 -p 5432 -U postgres
                timeout: 60s
          env:
            DATABASE_URL: postgres://postgres:test@127.0.0.1:${{ ports.postgres16 }}/app_test
          command: npm run test:integration
