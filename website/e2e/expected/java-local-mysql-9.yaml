version: 0

# A free port is picked per run, so two runs never collide.
ports:
  db: random

services:
  mysql:
    container:
      image: docker.io/library/mysql:9
      ports: ["${{ ports.db }}:3306"]
      env:
        MYSQL_ROOT_PASSWORD: test
        MYSQL_DATABASE: app_test
    ready:
      # runs inside the container, so the image's own client is used
      exec: mysqladmin ping -h 127.0.0.1 --silent
      timeout: 60s

test:
  name: ci
  sequence:
    - name: install
      command: ./mvnw -B -q dependency:go-offline
    - name: lint
      command: ./mvnw -B -q spotless:check
    - name: unit
      command: ./mvnw -B test
      # skipped when none of these changed since the last passing run
      inputs: ["src/**", "pom.xml"]
    - name: integration
      env:
        DATABASE_URL: mysql://root:test@127.0.0.1:${{ ports.db }}/app_test
      command: ./mvnw -B verify -Pintegration
